name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973" --install

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.95.0'
          targets: 'aarch64-linux-android'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install npm dependencies
        working-directory: apps/web
        run: npm ci

      - name: Make Gradle wrapper executable
        working-directory: apps/coomi-app
        run: chmod +x gradlew

      - name: Build APK
        working-directory: apps/coomi-app
        run: ./gradlew assembleDebug --no-daemon
        env:
          TERMUX_PACKAGE_VARIANT: "apt-android-7"
          TERMUX_APP_VERSION_NAME: ""

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: coomi-app-debug
          path: apps/coomi-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APK (demo)
        uses: actions/upload-artifact@v4
        with:
          name: coomi-app-demo
          path: apps/coomi-app/app/build/outputs/apk/demo/*.apk
          if-no-files-found: ignore