name: Build Coomi APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Coomi APK
        run: ./gradlew :app:assembleDebug --no-daemon -x stageCoomiWeb -x stageCoomiRustAndroid
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APP_VERSION_NAME: 1.2.1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coomi-app-debug
          path: apps/coomi-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error